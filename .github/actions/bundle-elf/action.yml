name: bundle-elf
description: >-
  Stage the three notcurses .so libs into `bundle/`, recursively walk
  ldd to copy ffmpeg sibling shared libs into the same dir, set
  DT_RUNPATH to $ORIGIN on every shipped .so, and strip.

  Caller must already have:
    - notcurses built under vendor/notcurses/build/
    - patchelf on PATH
    - `bundle/` writable (empty is fine; action creates it if absent)

inputs:
  extra-skip-libs:
    description: >-
      Space-separated list of additional ldd entry name patterns to
      treat as system libraries (skip bundling). The default skiplist
      covers glibc / common GNU runtime; musl callers should pass
      'ld-musl-*.so.1 libc.musl-*.so.1' so we don't try to bundle the
      musl loader / libc into the archive (alpine systems already
      have them).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Stage + relocate libs (recursive ldd + patchelf $ORIGIN)
      shell: bash
      env:
        EXTRA_SKIP_LIBS: ${{ inputs.extra-skip-libs }}
      run: |
        set -euxo pipefail
        mkdir -p bundle
        cd vendor/notcurses/build

        for lib in libnotcurses libnotcurses-core libnotcurses-ffi; do
          found=$(find . -name "${lib}.so.*" -type f | sort | tail -1)
          [[ -z "$found" ]] && found=$(find . -name "${lib}.so" -type f | head -1)
          cp "$found" "../../../bundle/${lib}.so"
        done

        cd ../../..

        # Bundle ffmpeg siblings + their transitive deps. Recursive
        # ldd walk — each new lib we copy into bundle/ gets its own
        # deps inspected until closure. Skip the system baseline
        # (libc, libm, libpthread, libdl, librt, libstdc++,
        # ld-linux, libgcc_s, libresolv) — those must stay dynamic
        # to avoid crt clashes. Musl callers extend this via
        # $EXTRA_SKIP_LIBS to also skip musl's loader/libc.
        is_system_lib() {
          local name="$1"
          case "$name" in
            libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*| \
            librt.so.*|libstdc++.so.*|ld-linux*|libgcc_s.so.*| \
            libresolv.so.*|libnsl.so.*|linux-vdso.so.*| \
            libutil.so.*|libcrypt.so.*)
              return 0 ;;
          esac
          # Caller-supplied skiplist (alpine musl loader names etc.).
          # Each entry is a glob pattern; match against name.
          if [[ -n "${EXTRA_SKIP_LIBS:-}" ]]; then
            local pat
            for pat in $EXTRA_SKIP_LIBS; do
              # shellcheck disable=SC2053
              [[ "$name" == $pat ]] && return 0
            done
          fi
          return 1
        }

        process_deps() {
          local lib="$1"
          # Strip any `(...)` trailing marker from ldd output and
          # skip non-absolute paths (catches `not found`, bare
          # filenames, etc.).
          ldd "$lib" 2>/dev/null \
            | sed -n 's/ (.*)$//; s/^[[:space:]]*\([^ ]\+\) => \(.\+\)$/\1\t\2/p' \
            | while IFS=$'\t' read -r name path; do
                is_system_lib "$name" && continue
                [[ -z "$path" ]] && continue
                [[ "$path" != /* && "$path" != ?:[/\\]* ]] && continue
                if [[ ! -f "bundle/$name" ]]; then
                  cp "$path" "bundle/$name"
                  echo "Bundled: $name  (from $path)"
                  process_deps "bundle/$name"  # recurse
                fi
              done
        }

        for lib in bundle/libnotcurses.so bundle/libnotcurses-core.so bundle/libnotcurses-ffi.so; do
          process_deps "$lib"
        done

        # Set rpath to $ORIGIN on every shipped .so so they find
        # siblings in their own directory at load time.
        find bundle -name '*.so*' -type f | while read f; do
          patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
        done

        find bundle -name '*.so*' -type f -exec strip --strip-unneeded {} \; 2>/dev/null || true

        echo "--- bundle contents ---"
        ls -la bundle/
        echo "--- ldd libnotcurses.so ---"
        ldd bundle/libnotcurses.so || true
