name: bundle-dll
description: >-
  Stage the three notcurses DLLs into `bundle/`, recursively walk
  MSYS2's ldd to copy sibling DLL deps into the same dir, then
  belt-and-braces sweep for ffmpeg codec + text-rendering DLLs that
  ldd sometimes misses on CLANGARM64.

  Caller must already have:
    - notcurses built under vendor/notcurses/build/
    - The MSYS2 default shell active (msys2 {0})
    - `bundle/` writable
    - msys2 ldd + timeout + sed on PATH

  Behaviour deliberately unchanged from the original build-binaries.yml
  inline block — this action is a pure lift.

runs:
  using: composite
  steps:
    - name: Stage + bundle sibling DLLs
      shell: 'msys2 {0}'
      run: |
        set -euxo pipefail
        mkdir -p bundle
        cd vendor/notcurses/build

        # MinGW DLL naming varies: libfoo-N.dll, libfoo.dll, foo.dll.
        # BUT: `notcurses` is a prefix of `notcurses-core` and
        # `notcurses-ffi`, so a loose *notcurses*.dll glob matches
        # all three and head -1 picks the same file every iteration.
        # Restrict: only allow `.` or `-<digits>` after the name.
        for lib in notcurses notcurses-core notcurses-ffi; do
          found=$(find . -type f \( \
              -iname "${lib}.dll" -o \
              -iname "lib${lib}.dll" -o \
              -iname "${lib}-[0-9]*.dll" -o \
              -iname "lib${lib}-[0-9]*.dll" \
            \) | head -1)
          if [[ -z "$found" ]]; then
            echo "❌ Could not locate built DLL for $lib"
            find . -iname "*${lib}*" -type f
            exit 1
          fi
          cp "$found" "../../../bundle/lib${lib}.dll"
          echo "Staged lib${lib}.dll (from $(basename $found))"
        done

        cd ../../..

        # On Windows, DLL search order finds siblings in the same
        # directory as the DLL being loaded — no rpath needed.
        # We just need to ensure every transitive dep is present
        # in bundle/. MSYS2's `ldd` works on Windows DLLs.
        #
        # Filter by PATH not by name: anything under C:\Windows\ is
        # a system DLL shipped with Windows itself and must stay
        # dynamic (bundling them would crash on newer Windows).
        # Also skip MSVC/UCRT runtime DLLs — these are always
        # available on any Windows machine modern enough to run
        # Rakudo.
        is_system_dll() {
          local name="$1"
          local path="$2"
          # Name-based skip: Windows API Set forwarders are ALWAYS
          # system DLLs and ALWAYS present on any supported Windows
          # version. ldd on ARM64 sometimes reports their paths
          # truncated or pointing at a directory; the name match
          # catches them regardless of what ldd says.
          case "${name,,}" in
            api-ms-*|ext-ms-*|ms-win-*)
              return 0 ;;
          esac
          # Path-based skip: anything under C:\Windows is a system
          # DLL and must stay dynamic.
          local lc="${path,,}"
          case "$lc" in
            /c/windows/*|c:/windows/*|c:\\windows\\*)
              return 0 ;;
          esac
          return 1
        }

        # Fallback: search known msystem bin dirs by name when ldd
        # gives us a bogus path. CLANGARM64's ldd is unreliable —
        # often reports directories or partial paths instead of
        # the actual DLL location. Silently skipping those would
        # lose ~100 legit ffmpeg codec / text-rendering DLLs.
        find_dll_by_name() {
          local name="$1"
          for search in /clangarm64/bin /ucrt64/bin /mingw64/bin /usr/bin; do
            if [[ -f "$search/$name" ]]; then
              echo "$search/$name"
              return 0
            fi
          done
          return 1
        }
        # Track DLLs we've already inspected so a cyclic ldd graph
        # (or one that lies the same way twice) can't loop forever.
        declare -A SEEN_DEPS=()

        process_deps() {
          local dll="$1"
          local depth="${2:-0}"
          # Hard recursion cap. The real DLL graph is ~3 deep;
          # anything past 12 is a cycle or a buggy ldd, not real.
          if (( depth > 12 )); then
            echo "process_deps: depth cap hit at $dll, stopping"
            return 0
          fi
          local key="$(basename "$dll")"
          [[ -n "${SEEN_DEPS[$key]:-}" ]] && return 0
          SEEN_DEPS[$key]=1

          # Wrap ldd in `timeout` — on Windows ARM, ldd
          # subprocesses periodically wedge inside xtajit64
          # emulation and never return. 30s is generous; a healthy
          # ldd call on these DLLs finishes in well under a second.
          # Retry a few times: most xtajit64 deadlocks clear on a
          # fresh process. If it stays stuck after 4 tries, fail
          # the job — silently skipping would ship a bundle missing
          # this DLL's transitive deps, which then explodes at
          # runtime on a user's machine. A failed CI job is much
          # cheaper than a broken release.
          local ldd_out=""
          local attempt
          for attempt in 1 2 3 4; do
            if ldd_out="$(timeout 30s ldd "$dll" 2>/dev/null)"; then
              break
            fi
            echo "process_deps: ldd attempt $attempt timed out on $dll, retrying..."
            sleep 2
            ldd_out=""
          done
          if [[ -z "$ldd_out" ]]; then
            echo "❌ ldd permanently wedged on $dll after 4 attempts."
            echo "   Almost certainly a xtajit64 deadlock on Windows ARM —"
            echo "   restart the workflow run. If it keeps failing on the"
            echo "   same DLL, that DLL itself is broken or the runner is"
            echo "   in a bad state."
            exit 1
          fi

          local line name path
          while IFS=$'\t' read -r name path; do
            [[ -z "$path" ]] && continue
            if is_system_dll "$name" "$path"; then
              continue
            fi
            if [[ ! -f "$path" ]]; then
              if resolved=$(find_dll_by_name "$name"); then
                path="$resolved"
                echo "Resolved $name via fallback: $path"
              else
                echo "Skipping $name: unresolvable (ldd path='$path', not in known bin dirs)"
                continue
              fi
            fi
            if [[ ! -f "bundle/$name" ]]; then
              cp "$path" "bundle/$name"
              echo "Bundled: $name  (from $path)"
              process_deps "bundle/$name" $((depth + 1))
            fi
          done < <(printf '%s\n' "$ldd_out" \
                     | sed -n 's/ (.*)$//; s/^[[:space:]]*\([^ ]\+\) => \(.\+\)$/\1\t\2/p')
        }

        for dll in bundle/libnotcurses.dll bundle/libnotcurses-core.dll bundle/libnotcurses-ffi.dll; do
          process_deps "$dll"
        done

        # Belt-and-braces sweep: some msystem variants (notably
        # CLANGARM64) have ldd failures that cause ffmpeg's codec
        # + text-rendering deps to be silently missed. If the DLLs
        # exist in the msystem bin dir, copy them anyway —
        # can't hurt (they're already dynamic deps somewhere in
        # the graph), and catches the cases where ldd lies.
        # Process each copied lib through process_deps for its own
        # transitive deps.
        echo "--- belt-and-braces sweep ---"
        for name in \
            libncursesw6.dll libncurses6.dll \
            libunistring-5.dll libunistring-2.dll \
            libdeflate.dll \
            libpng16-16.dll libjpeg-8.dll libwebp-7.dll libwebpmux-3.dll \
            libsharpyuv-0.dll libgif-7.dll libtiff-6.dll \
            libiconv-2.dll libintl-8.dll \
            libstdc++-6.dll libgcc_s_seh-1.dll libgcc_s_1.dll \
            libssp-0.dll libgomp-1.dll \
            zlib1.dll liblzma-5.dll libbz2-1.dll \
            libexpat-1.dll libxml2-16.dll libxml2-2.dll \
            libx264-165.dll libx265-215.dll libvpx-1.dll libdav1d-7.dll \
            libSvtAv1Enc-4.dll libopus-0.dll libmp3lame-0.dll \
            libvorbis-0.dll libvorbisenc-2.dll libogg-0.dll \
            libfreetype-6.dll libfontconfig-1.dll \
            libharfbuzz-0.dll libgraphite2.dll \
            libbrotlidec.dll libbrotlicommon.dll \
            swresample-6.dll \
            libopenjp2-7.dll \
        ; do
          if [[ ! -f "bundle/$name" ]]; then
            if resolved=$(find_dll_by_name "$name"); then
              cp "$resolved" "bundle/$name"
              echo "Swept in: $name  (from $resolved)"
              process_deps "bundle/$name"
            fi
            # If not found, silently skip — this variant's ffmpeg
            # simply doesn't ship it, either statically baked in
            # or unsupported on this platform.
          fi
        done

        echo "--- bundle contents ---"
        ls -la bundle/

    - name: Audit bundle self-containment (objdump imports)
      shell: 'msys2 {0}'
      run: |
        set -euo pipefail
        # For every bundled .dll, list its PE import table via
        # `objdump -p` and reject any imported DLL name that isn't
        # either a Windows system DLL (universally available on
        # every supported Windows version) or a sibling in bundle/.
        # Catches the failure mode where ldd's recursive walk
        # missed a DLL and the belt-and-braces sweep didn't catch
        # it either — the bundle works in CI (msys2 has the DLL
        # on PATH) but fails on a user's machine.
        is_system_dll() {
          local name_lc="${1,,}"
          # Windows API Set forwarders (api-ms-*, ext-ms-*, ms-win-*)
          # are always present in System32 on Win 10+. The named
          # system DLLs below are the long-standing Win32 API
          # surface — kernel32, user32, advapi32, msvcrt, etc.
          case "$name_lc" in
            api-ms-*|ext-ms-*|ms-win-*)
              return 0 ;;
            kernel32.dll|kernelbase.dll|user32.dll|advapi32.dll|\
            msvcrt.dll|ntdll.dll|ole32.dll|oleaut32.dll|\
            shell32.dll|gdi32.dll|gdi32full.dll|shlwapi.dll|\
            shcore.dll|comctl32.dll|comdlg32.dll|crypt32.dll|\
            secur32.dll|setupapi.dll|ws2_32.dll|wsock32.dll|\
            iphlpapi.dll|wininet.dll|winmm.dll|winhttp.dll|\
            psapi.dll|version.dll|imm32.dll|d3d11.dll|d3d9.dll|\
            dxgi.dll|d2d1.dll|dwrite.dll|opengl32.dll|\
            bcrypt.dll|ncrypt.dll|userenv.dll|combase.dll|\
            normaliz.dll|powrprof.dll|propsys.dll|rpcrt4.dll|\
            urlmon.dll|wldap32.dll|cabinet.dll|profapi.dll|\
            mscoree.dll|dbghelp.dll|cfgmgr32.dll|dwmapi.dll|\
            uxtheme.dll|winspool.drv|wtsapi32.dll|netapi32.dll|\
            dnsapi.dll|mpr.dll|cryptsp.dll|cryptbase.dll|\
            avrt.dll|avicap32.dll|mfplat.dll|mfreadwrite.dll|\
            mf.dll|evr.dll|d3dcompiler_*.dll|dxva2.dll|\
            ucrtbase.dll|vcruntime*.dll)
              return 0 ;;
          esac
          return 1
        }
        fail=0
        for dll in bundle/*.dll; do
          [[ -L "$dll" ]] && continue
          # objdump -p output has lines like:
          #   DLL Name: libavcodec-62.dll
          # Match those, extract the name.
          while IFS= read -r imp; do
            [[ -z "$imp" ]] && continue
            if is_system_dll "$imp"; then
              continue
            fi
            if [[ -f "bundle/$imp" ]]; then
              continue
            fi
            echo "::error file=$dll::imports '$imp' which is neither a system DLL nor a bundle sibling"
            fail=1
          done < <(objdump -p "$dll" 2>/dev/null | awk '/DLL Name:/{print $3}')
        done
        if (( fail != 0 )); then
          echo
          echo "❌ Bundle audit failed: one or more bundled DLLs import"
          echo "   non-system DLLs that aren't present in bundle/."
          echo "   Those imports would fail on a user's machine. Either"
          echo "   add the missing DLLs to the belt-and-braces sweep in"
          echo "   process_deps's belt-and-braces section above, or fix"
          echo "   ldd's walk to capture them."
          exit 1
        fi
        echo "✅ Bundle self-containment audit passed: every bundled DLL's"
        echo "   imports resolve inside bundle/ or to Windows system DLLs."
