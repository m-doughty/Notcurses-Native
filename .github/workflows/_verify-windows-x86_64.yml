# Reusable workflow: verify the windows-x86_64 prebuilt installs +
# loads on a current Windows runner. setup-raku@v1 ships native
# x86_64 Rakudo for windows-2022.
#
# Upstream notcurses-tester is broken on Windows (per
# doc/notcurses.md, "Microsoft Windows" section), so we don't run the
# terminal suite. The focused PowerShell probe below removes MSYS2 from
# PATH and calls a symbol through the full libnotcurses DLL, exercising
# the install, loader, dependency closure, and symbol resolution without
# requiring a TTY.

name: _verify-windows-x86_64

on:
  workflow_call:

env:
  NOTCURSES_NATIVE_REQUIRE_SHIM: '1'

jobs:
  verify:
    runs-on: windows-2022
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - uses: Raku/setup-raku@v1
        with: { raku-version: 'latest' }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libdeflate
            mingw-w64-ucrt-x86_64-libunistring
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain

      - name: Record native Raku executable for restricted-PATH probe
        run: |
          raku_exe=$(raku -e 'print $*EXECUTABLE.absolute')
          printf 'NOTCURSES_TEST_RAKU=%s\n' "$raku_exe" >> "$GITHUB_ENV"

      - name: zef install (prebuilt path)
        run: zef install --/test .

      - name: Full DLL closure loads with restricted PATH (prebuilt)
        shell: pwsh
        run: ./scripts/ci/verify-windows-loader.ps1 -Mode prebuilt

      # pwsh, not the job's msys2 default shell. Under MSYS2, TMPDIR=/tmp makes
      # Rakudo report $*TMPDIR as a Windows path (D:\a\_temp\msys64\tmp) which
      # zef then extends with forward slashes; its git/tar extractor plugins
      # fail on the resulting mixed-separator path and the fetch aborts. Every
      # other repo here installs App::Prove6 from a native Windows shell and
      # has no such trouble. Only the fetch/extract is affected, so the prove6
      # runs below stay in the msys2 shell, where the source-built DLLs find
      # their MSYS2 dependencies on PATH.
      - name: zef install App::Prove6
        shell: pwsh
        run: zef install --/test App::Prove6

      # The Raku suite runs here exactly as it does on the linux and macos
      # lanes. Only the upstream C notcurses-tester is unusable on Windows
      # (see the header); t/ is pure Raku and needs no TTY. The xt/ suite is
      # deliberately not run — those tests are terminal-dependent and this
      # runner has no console.
      - name: prove6 (prebuilt path)
        run: prove6 --verbose -I lib -I t/lib t

      - name: zef install (source-build path)
        env: { NOTCURSES_NATIVE_BUILD_FROM_SOURCE: '1' }
        run: |
          printf 'NOTCURSES_TEST_MSYS2_BIN=%s\n' \
            "$(cygpath -w "$MINGW_PREFIX/bin")" >> "$GITHUB_ENV"
          zef install --/test --force-install .

      - name: Source-built DLLs load with MSYS2 PATH
        shell: pwsh
        run: ./scripts/ci/verify-windows-loader.ps1 -Mode source

      - name: prove6 (source-build path)
        run: prove6 --verbose -I lib -I t/lib t
