# Top-level orchestrator: run every per-platform verify lane on
# push or pull_request. Mirrors release.yml's shape — one reusable
# workflow file per lane, each producing exactly one job in the
# GHA UI (no `if:`-gated skipped jobs).

name: ci

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  verify-macos-arm64:
    uses: ./.github/workflows/_verify-macos-arm64.yml
  verify-macos-x86_64:
    uses: ./.github/workflows/_verify-macos-x86_64.yml
  verify-linux-glibc-x86_64:
    uses: ./.github/workflows/_verify-linux-glibc-x86_64.yml
  verify-linux-glibc-aarch64:
    uses: ./.github/workflows/_verify-linux-glibc-aarch64.yml
  verify-linux-musl-x86_64:
    uses: ./.github/workflows/_verify-linux-musl-x86_64.yml
  verify-linux-musl-aarch64:
    uses: ./.github/workflows/_verify-linux-musl-aarch64.yml
  verify-windows-x86_64:
    uses: ./.github/workflows/_verify-windows-x86_64.yml
  verify-windows-arm64:
    uses: ./.github/workflows/_verify-windows-arm64.yml
