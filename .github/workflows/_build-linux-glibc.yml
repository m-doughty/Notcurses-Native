# Reusable workflow: build the linux-<arch>-glibc prebuilt notcurses
# archive in a manylinux2014 Docker container (RHEL 7 baseline,
# glibc 2.17). Produces binaries that load on every glibc Linux
# distro still shipping in 2026 — RHEL 7+, Ubuntu 14.04+, Debian 8+.
#
# Why docker-run from native host instead of GHA's `container:`
# directive: GHA's Node 24 JS-action runtime is built against
# glibc ≥ 2.27/2.28 + libstdc++ from gcc ≥ 5. manylinux2014 ships
# glibc 2.17 + libstdc++ from devtoolset-9, so JS actions
# (actions/checkout, actions/upload-artifact, actions/cache) crash
# at startup with "GLIBC_2.27 not found / CXXABI_1.3.8 not found"
# the moment they try to launch their bundled node binary. Workaround
# is to run JS actions on the native ubuntu-22.04 / -arm runner
# (glibc 2.35, fresh Node 24 works fine) and only invoke the
# manylinux2014 container for the build itself.
#
# RHEL 7's repos don't ship modern ffmpeg / libdeflate, so we
# source-build both inside the container. ncurses + libunistring
# are available from the manylinux base image's devtoolset.

name: _build-linux-glibc

on:
  workflow_call:
    inputs:
      arch:
        description: '`x86_64` or `aarch64`.'
        type: string
        required: true
      artifact-name:
        description: 'Archive basename, e.g. notcurses-linux-x86_64-glibc.'
        type: string
        required: true

jobs:
  build:
    name: build-linux-${{ inputs.arch }}-glibc
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache source-built ffmpeg + libdeflate
        uses: actions/cache@v4
        with:
          # Cached path is workspace-relative so the docker bind
          # mount picks it up automatically. The build script reads
          # it via $CACHE_DIR.
          path: _ci-cache/manylinux2014-${{ inputs.arch }}
          # Key on:
          #   * the manylinux2014_<arch> tag (image baseline)
          #   * hashes of the source-build scripts so a version bump
          #     invalidates the cache automatically.
          # No fallback restore-keys — partial caches would corrupt
          # the install tree mid-pkgconfig.
          key: vendored-deps-manylinux2014-${{ inputs.arch }}-${{ hashFiles('scripts/ci/build-ffmpeg.sh', 'scripts/ci/build-libdeflate.sh') }}

      - name: Pull build image
        run: docker pull quay.io/pypa/manylinux2014_${{ inputs.arch }}

      - name: Build + bundle in manylinux2014 container
        run: |
          # $PWD on the runner is bind-mounted to /work in the
          # container — so checkout's output AND the cache dir are
          # visible to the build script.
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e CACHE_DIR=/work/_ci-cache/manylinux2014-${{ inputs.arch }} \
            quay.io/pypa/manylinux2014_${{ inputs.arch }} \
            bash scripts/ci/build-linux-glibc.sh

      - name: Package + upload
        uses: ./.github/actions/package-and-upload
        with:
          artifact-name: ${{ inputs.artifact-name }}
          format: tar.gz
