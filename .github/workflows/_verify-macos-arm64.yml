# Reusable workflow: verify the macos-arm64 prebuilt installs +
# loads + decodes. Runs unconditionally — no `if:` gating, so every
# invocation produces exactly one job in the GHA UI.
#
# setup-raku@v1 ships native arm64 Rakudo for macos-14, so the
# Rakudo install is one action call. No source-build needed.

name: _verify-macos-arm64

on:
  workflow_call:

env:
  TERM: xterm
  COLORTERM: truecolor
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  NOTCURSES_NATIVE_REQUIRE_SHIM: '1'

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - uses: Raku/setup-raku@v1
        with: { raku-version: 'latest' }

      - name: zef install (prebuilt path)
        run: zef install --/test .

      - name: zef install App::Prove6
        run: zef install --/test App::Prove6

      - name: prove6 (prebuilt path)
        run: prove6 --verbose -I lib -I t/lib t

      - name: prove (xt — terminal-dependent, prebuilt path)
        run: prove -e 'raku -I lib -I t/lib' --verbose xt/*.rakutest

      - name: Install brew deps for source-build pass
        run: brew install cmake pkg-config ffmpeg ncurses libunistring libdeflate

      - name: zef install (source-build path)
        env: { NOTCURSES_NATIVE_BUILD_FROM_SOURCE: '1' }
        run: zef install --/test --force-install .

      - name: prove6 (source-build path)
        run: prove6 --verbose -I lib -I t/lib t
